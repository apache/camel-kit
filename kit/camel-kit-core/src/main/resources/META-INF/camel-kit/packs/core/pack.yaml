id: core
schema: 1
skillTrees: [shared, camel-start, camel-brainstorm, camel-migrate, camel-plan, camel-execute, camel-ship]
add:
  step/validate/report/timestamp:
    contract: 1
    resource: report-timestamp.md
  provider/mule-xml:
    contract: 1
    provider:
      service: org.apache.camel.kit.graph.parser.MigrationParser
      implementation: org.apache.camel.kit.graph.parser.MuleXmlFlowParser
  provider/mule:
    contract: 1
    provider:
      service: org.apache.camel.kit.graph.model.GraphTypeAdapter
      implementation: org.apache.camel.kit.graph.adapter.mule.MuleGraphAdapter
  provider/biztalk:
    contract: 1
    provider:
      service: org.apache.camel.kit.graph.model.GraphTypeAdapter
      implementation: org.apache.camel.kit.graph.adapter.biztalk.BizTalkGraphAdapter
